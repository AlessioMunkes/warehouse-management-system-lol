name: CI

# Runs on every push and pull request targeting main or develop.
# workflow_dispatch lets anyone trigger it manually from the Actions tab.
on:
  push:
    branches: [main, staging/(DEVELOPMENT-TESTING)]
  pull_request:
    branches: [main, staging/(DEVELOPMENT-TESTING)]
  workflow_dispatch:

# Cancel older, superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Server (Node / Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Dummy values so index.js / db.js don't crash on missing env vars
          # during CI. Replace with real integration-test values once a test
          # suite exists. Never put real secrets here — use repo Secrets
          # for anything that touches a real database.
          JWT_SECRET: ci-test-secret
          DB_USER: ci_test
          DB_HOST: localhost
          DB_NAME: ci_test
          DB_PASSWORD: ci_test
          DB_PORT: 5432