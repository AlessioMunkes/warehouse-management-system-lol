name: CI

# ── TRIGGERS ──────────────────────────────────────────────────────
# Branch names below must match your GitHub branches EXACTLY —
# case-sensitive, no partial matching. Update this list whenever you
# rename a branch or want CI to also watch a new one.
on:
  push:
    branches: [main, "staging/(DEVELOPMENT-TESTING)"]      
  pull_request:
    branches: [main, "staging/(DEVELOPMENT-TESTING)"]    
  workflow_dispatch:   # lets you manually trigger a run from the Actions tab

# Cancels older, superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CLIENT: React + Vite app in /client ──────────────────────────
  client:
    name: Client (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client       

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'                       
          cache: 'npm'
          cache-dependency-path: client/package-lock.json 

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint  

      - name: Build
        run: npm run build     

  # ── SERVER: Node / Express app in /server ────────────────────────
  server:
    name: Server (Node / Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server      

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'                         
          cache: 'npm'
          cache-dependency-path: server/package-lock.json  

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test              
        env:
          # Fake values so the app doesn't crash on startup during tests.
          # Fine to leave exactly as-is — these never touch a real database.
          # Once you actually deploy, REAL secrets go in:
          #   GitHub repo → Settings → Secrets and variables → Actions
          # and get referenced here as ${{ secrets.NAME }}, never typed in plain text.
          JWT_SECRET: ci-test-secret      # ← PLACEHOLDER: fine as-is for CI
          DB_USER: ci_test               # ← PLACEHOLDER: fine as-is for CI
          DB_HOST: localhost             # ← PLACEHOLDER: fine as-is for CI
          DB_NAME: ci_test               # ← PLACEHOLDER: fine as-is for CI
          DB_PASSWORD: ci_test           # ← PLACEHOLDER: fine as-is for CI
          DB_PORT: 5432                  # ← PLACEHOLDER: fine as-is for CI
