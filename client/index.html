<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- /icons/favicon.svg, not /favicon.svg. Commit ba3f2f8 moved the
         file into public/icons/ and this link kept pointing at the old
         path, so the tab icon 404'd silently from then on. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

    <!-- Installed-app chrome. iOS ignores manifest icons and reads
         apple-touch-icon instead; the capable tags make "Add to Home
         Screen" open full-screen rather than in a Safari tab. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#7A1A1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LoL WMS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Ladles of Love: Warehouse Management</title>
  </head>
  <body>
    <div id="root">
      <!-- Plain links for anything that reads this page without running
           the app (a crawler, Google's consent-screen review, a very slow
           first load). React replaces everything inside #root the moment
           it starts, so signed-in users never see these. -->
      <p style="font:14px system-ui,sans-serif;text-align:center;margin:24px">
        <a href="/privacy">Privacy Policy</a> &middot; <a href="/terms">Terms of Service</a>
      </p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
